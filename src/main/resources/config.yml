prefix: "<dark_gray>[<yellow>Console<white>Pipe<dark_gray>]<white>: "
pipe-format: "<dark_gray>[<gray>%timestamp%<dark_gray>] [<gold>%sender%<dark_gray>]<gray>:<newline><white>%message%"

prefix-enabled: true
upload-enabled: false

list-items-per-page: 10

# This supports pastes.dev only at the moment.
upload-url: "https://api.pastes.dev/post"
base-url: "https://pastes.dev/"

messages:
    help:
        usage: ""
        log-select: "<white>Usage: <gray>/consolepipe logs select [log]"
    errors:
        no-permission: "You do not have permission to use this command."
        no-player: "You must be a player to use this command."
        no-list: "No players are currently piped!"
        not-registered: "<red>%player%<gray> is not registered!"
        log-not-found: "<red>Log <gray>%log%<red> not found!"
        no-log-selected: "<red>No log selected! Use <gray>/consolepipe logs select <log></gray>."
        log-upload-failed: "<red>Failed to upload log! Error: <red>%error%."
        log-read-failed: "<red>Failed to read log!"
        log-search-no-results: "<red>No results found for given RegEx!"

    pipe:
        piped: "You have been piped!"
        unpiped: "You have been unpiped!"
        piped-player: "<white>%player%<gray> has been piped!"
        unpiped-player: "<white>%player%<gray> has been unpiped!"
        filter-set: "<white>A new filter has been set."
        filter-set-player: "<white>%player%<gray>'s filter has been set."

        already-piped: "You are already piped!"
        already-unpiped: "You are already unpiped!"
        player-already-piped: "<white>%player%<gray> is already piped!"
        player-already-unpiped: "<white>%player%<gray> is already unpiped!"
        list: "<white>Players currently piped:<newline><red>%players%"

    logs:
        list:
            header: |
                <dark_gray>------------------ %prefix% <dark_gray>------------------
                <white>Click on a log to select it
                Current Page: <gray>%page% / %pages%<newline>
            item: "<hover:show_text:'Click to select log'><click:run_command:'/consolepipe logs select %log%'><white>%log%</click> <gray>(%size% bytes)"
            no-logs: "<red>No logs available!"
            footer: |
                <newline><dark_gray>-------------------------------------------------
        selected: "<white>Selected log: <gray>%log%"
        line: "<gray>Contents of line %line%: <white>%contents%"
        search-result: "<white>Search results in log %log%: <hover:show_text:'%results%'><click:copy_to_clipboard:'%results%'><gray>[Click to copy to clipboard]</click>"
        uploaded: |
            <white>Log <gray>%log%<white> has been uploaded!<newline><white><click:open_url:%link%><hover:show_text:"Click to open in the browser!">Link: <gray>%link%</click>
        info: |
            <gold>Log Information:
            <red>Selected Log Name: <white>%name%
            <red>Log File Size: <white>%size% Bytes
            <red>Last Modified: <white>%modified%

    reload: "<red>Reloaded ConsolePipe!"